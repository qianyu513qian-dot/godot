[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="quality_supervision.json,supervision_state.json,_project.godot.import-backup,Godot/app_userdata/*,verification/operational_probe_appdata/*,verification/operational_package_probe_appdata/*,verification/r68_package_probe_appdata/*,verification/r68_package_probe_final_appdata/*,verification/r68_package_probe_single_appdata/*,verification/r68_package_probe_revised_appdata/*,verification/r68_challenge_current_once_appdata/*,verification/r68_candidate_smoke_appdata/*,verification/challenge5_once_appdata/*"
export_path="export/AoELite3D.exe"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
shader_baker/enabled=false
binary_format/architecture="x86_64"
codesign/enable=false
codesign/timestamp=true
codesign/timestamp_server_url=""
codesign/digest_algorithm=1
codesign/description=""
codesign/custom_options=PackedStringArray()
application/modify_resources=true
application/icon=""
application/console_wrapper_icon=""
application/icon_interpolation=4
application/file_version=""
application/product_version=""
application/company_name="AoELite"
application/product_name="AoE Lite 3D"
application/file_description="AoE Lite 3D"
application/copyright=""
application/trademarks=""
application/export_angle=0
application/export_d3d12=0
application/d3d12_agility_sdk_multiarch=true
ssh_remote_deploy/enabled=false
ssh_remote_deploy/host="user@host_ip"
ssh_remote_deploy/port="22"
ssh_remote_deploy/extra_args_ssh=""
ssh_remote_deploy/extra_args_scp=""
ssh_remote_deploy/run_script="Expand-Archive -LiteralPath '{temp_dir}\\{archive_name}' -DestinationPath '{temp_dir}'
$action = New-ScheduledTaskAction -Execute '{temp_dir}\\{exe_name}' -Argument '{cmd_args}'
$trigger = New-ScheduledTaskTrigger -Once -At 00:00
$settings = New-ScheduledTaskSettingsSet
Register-ScheduledTask -TaskName '{scheduled_task_name}' -Action $action -Trigger $trigger -Settings $settings -Force -User System
Start-ScheduledTask -TaskName '{scheduled_task_name}'
while (Get-ScheduledTask -TaskName '{scheduled_task_name}' | ? State -eq Running) { Start-Sleep -Milliseconds 100 }
Unregister-ScheduledTask -TaskName '{scheduled_task_name}' -Confirm:$false -ErrorAction:SilentlyContinue"
ssh_remote_deploy/cleanup_script="Stop-ScheduledTask -TaskName '{scheduled_task_name}' -Force -ErrorAction:SilentlyContinue
$task = Get-ScheduledTask -TaskName '{scheduled_task_name}' -ErrorAction:SilentlyContinue
Wait-ScheduledTask -TaskName '{scheduled_task_name}' -ErrorAction:SilentlyContinue
Unregister-ScheduledTask -TaskName '{scheduled_task_name}' -Confirm:$false -ErrorAction:SilentlyContinue
Remove-Item -LiteralPath '{temp_dir}' -Force -Recurse -ErrorAction:SilentlyContinue"
